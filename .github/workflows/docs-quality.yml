name: Documentation Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/**/*.md"
      - ".github/workflows/docs-quality.yml"
      - ".github/markdown-link-check.json"
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**"
      - "README.md"
      - ".github/**/*.md"
      - ".github/markdown-link-check.json"

jobs:
  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"
          folder-path: "docs/, .github/patterns/"
          file-path: "README.md"

  check-formatting:
    name: Check Markdown Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint "**/*.md" --ignore node_modules --ignore .next --config .markdownlint.json
        continue-on-error: true

  check-spelling:
    name: Check Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check spelling
        uses: reviewdog/action-misspell@d6429416b12b09b4e2768307d53bef58d172e962 # v1.27.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          locale: "US"
          reporter: github-pr-review
          level: warning
          filter_mode: diff_context

  detect-stale:
    name: Detect Stale Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Check for stale docs
        run: |
          echo "Checking for documentation files not updated in 6+ months..."

          # Find markdown files older than 180 days
          stale_files=$(find docs -name "*.md" -type f -mtime +180 2>/dev/null || echo "")

          if [ -n "$stale_files" ]; then
            echo "⚠️ Found potentially stale documentation:"
            echo "$stale_files" | while read -r file; do
              last_modified=$(git log -1 --format="%ai" -- "$file" 2>/dev/null || echo "unknown")
              echo "  - $file (last modified: $last_modified)"
            done
            echo ""
            echo "📝 These files may need review. Consider:"
            echo "  1. Updating content if outdated"
            echo "  2. Moving to docs/archive/ if deprecated"
            echo "  3. Adding 'Last Updated' date if still current"
          else
            echo "✅ No stale documentation detected"
          fi

  check-structure:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Checking for required documentation files..."

          required_files=(
            "README.md"
            "docs/README.md"
            "docs/DEVELOPMENT.md"
            "docs/CONTRIBUTING.md"
            "docs/SECURITY.md"
            "docs/guides/QUICKSTART.md"
            ".github/copilot-instructions.md"
            ".github/copilot-quick-reference.md"
            ".github/patterns/README.md"
          )

          missing_files=()

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done

          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "❌ Missing required files:"
            printf '  - %s\n' "${missing_files[@]}"
            exit 1
          else
            echo "✅ All required documentation files present"
          fi

      - name: Check pattern library completeness
        run: |
          echo "Checking pattern library..."

          pattern_count=$(find .github/patterns -name "*.md" -not -name "README.md" | wc -l)

          echo "Found $pattern_count pattern files"

          if [ "$pattern_count" -lt 6 ]; then
            echo "⚠️ Pattern library seems incomplete (expected at least 6 patterns)"
            exit 1
          else
            echo "✅ Pattern library looks good ($pattern_count patterns)"
          fi

  check-references:
    name: Check Cross-References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - name: Check internal links
        run: |
          echo "Checking for broken internal documentation links..."

          # Simple check for common broken link patterns
          broken_refs=$(grep -rn "\](docs/" docs/ README.md .github/ 2>/dev/null | grep -v "\.md:" || echo "")

          if [ -n "$broken_refs" ]; then
            echo "⚠️ Found potentially incorrect relative links:"
            echo "$broken_refs"
            echo ""
            echo "💡 Internal links should use relative paths from file location"
          else
            echo "✅ No obvious broken internal links detected"
          fi

  summary:
    name: Documentation Quality Summary
    runs-on: ubuntu-latest
    needs:
      [
        check-links,
        check-formatting,
        check-spelling,
        detect-stale,
        check-structure,
        check-references,
      ]
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 📚 Documentation Quality Check Summary"
            echo ""
            echo "All documentation quality checks completed!"
            echo ""
            echo "### Checks Run:"
            echo "- ✅ Markdown link validation"
            echo "- ✅ Formatting standards"
            echo "- ✅ Spelling check"
            echo "- ✅ Stale content detection"
            echo "- ✅ Documentation structure"
            echo "- ✅ Cross-reference validation"
          } >> "$GITHUB_STEP_SUMMARY"
