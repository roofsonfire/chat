name: Deploy to Cloud Run (Staging)

on:
  # Deploy when CI workflow completes successfully
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub UI

env:
  PROJECT_ID: norse-breaker-474323-n8
  REGION: us-central1
  SERVICE_NAME: chat-staging
  DOMAIN: staging.chat.daza.ar

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Check deployment trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "🎯 Deployment triggered by successful CI workflow"
            echo "CI Run: ${{ github.event.workflow_run.html_url }}"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "🎯 Deployment triggered manually"
            echo "Commit: ${{ github.sha }}"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Alternativa con Workload Identity (más seguro):
          # workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github/providers/github'
          # service_account: 'github-actions@norse-breaker-474323-n8.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        id: docker-build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          docker build \
            --build-arg NODE_ENV=production \
            --tag "${IMAGE_TAG}" \
            --tag "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest" \
            .
          
          docker push "${IMAGE_TAG}"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest"
          
          echo "image_url=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.docker-build.outputs.image_url }}
          flags: |
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --timeout=300
            --max-instances=10
            --min-instances=0
            --concurrency=80
            --port=3000
          env_vars: |
            NODE_ENV=production
            GOOGLE_PROJECT_ID=${{ env.PROJECT_ID }}
            GOOGLE_LOCATION=${{ env.REGION }}
            GOOGLE_VERTEX_AI_MODEL_ID=gemini-2.5-flash-image
            NEXTAUTH_URL=https://${{ env.DOMAIN }}
          secrets: |
            NEXTAUTH_SECRET=nextauth-secret:latest
            AUTH_USER_EMAIL=auth-email:latest
            AUTH_USER_PASSWORD_HASH=auth-password-hash:latest

      - name: Map custom domain (if not exists)
        continue-on-error: true # El mapping puede ya existir
        run: |
          gcloud run domain-mappings describe \
            --domain=${{ env.DOMAIN }} \
            --region=${{ env.REGION }} \
            --quiet || \
          gcloud run domain-mappings create \
            --service=${{ env.SERVICE_NAME }} \
            --domain=${{ env.DOMAIN }} \
            --region=${{ env.REGION }}

      - name: Show deployment URL
        run: |
          echo "🚀 Deployment successful!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "Custom Domain: https://${{ env.DOMAIN }}"
          echo "Commit: ${{ github.sha }}"

      - name: Verify deployment
        run: |
          # Esperar un poco para que el servicio esté listo
          sleep 10
          
          # Verificar que el servicio responde
          CLOUD_RUN_URL="${{ steps.deploy.outputs.url }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CLOUD_RUN_URL}")
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ] || [ "$HTTP_STATUS" -eq 307 ] || [ "$HTTP_STATUS" -eq 401 ]; then
            echo "✅ Service is responding (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Service returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Deployment Preview
              
              **Status:** ✅ Deployed successfully
              **Service URL:** ${{ steps.deploy.outputs.url }}
              **Custom Domain:** https://${{ env.DOMAIN }}
              **Commit:** \`${{ github.sha }}\`
              
              Test the deployment and verify all features work correctly.`
            })

  # Job para rollback en caso de emergencia
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    needs: [deploy]
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Rollback to previous revision
        run: |
          echo "⚠️ Deployment failed, attempting rollback..."
          
          # Obtener la penúltima revisión
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(name)' \
            --limit=2 | tail -n 1)
          
          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Rolling back to revision: $PREVIOUS_REVISION"
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=$PREVIOUS_REVISION=100
            echo "✅ Rollback complete"
          else
            echo "⚠️ No previous revision found for rollback"
          fi
