name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download actionlint
        run: |
          ACTIONLINT_VERSION="1.7.6"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz --directory "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/actionlint"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: actionlint
    env:
      NEXTAUTH_SECRET: ${{ secrets.TEST_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      DISABLE_RATE_LIMIT: "true"
      SKIP_VERTEX_MODEL_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Prettier check
        run: npx prettier --check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    env:
      NODE_ENV: test
      NEXTAUTH_SECRET: ${{ secrets.TEST_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_USER_EMAIL: ${{ secrets.TEST_AUTH_USER_EMAIL }}
      AUTH_USER_PASSWORD_HASH: ${{ secrets.TEST_AUTH_PASSWORD_HASH }}
      GOOGLE_PROJECT_ID: "dummy-project-id"
      GOOGLE_LOCATION: "us-central1"
      GOOGLE_VERTEX_AI_MODEL_ID: "gemini-2.5-flash-image"
      GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      NEXT_PUBLIC_TEST_EMAIL: ${{ secrets.TEST_AUTH_USER_EMAIL }}
      NEXT_PUBLIC_TEST_PASSWORD: "test123"
      ENABLE_TEST_CREDENTIALS: "true"
      NEXT_PUBLIC_ENABLE_TEST_CREDENTIALS: "true"
      DISABLE_RATE_LIMIT: "true"
      SKIP_VERTEX_MODEL_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --project=unit

      - name: Generate coverage report
        run: npx vitest run --coverage --project=unit

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      # Required for Next.js build validation. These are dummy values.
      NEXTAUTH_SECRET: "test-secret-for-build-only-minimum-32-characters"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_USER_EMAIL: "build@example.com"
      AUTH_USER_PASSWORD_HASH: "build-hash"
      GOOGLE_PROJECT_ID: "build-project"
      GOOGLE_LOCATION: "us-central1"
      GOOGLE_VERTEX_AI_MODEL_ID: "gemini-2.5-flash"
      GOOGLE_CLIENT_ID: "build-client-id"
      GOOGLE_CLIENT_SECRET: "build-client-secret"
      ALLOWED_EMAILS: "build@example.com"
      DISABLE_RATE_LIMIT: "true"
      SKIP_VERTEX_MODEL_VALIDATION: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          ls -la .next
          if [ ! -d ".next/standalone" ]; then
            echo "::error::Build output missing '.next/standalone' directory."
            exit 1
          fi
          if [ ! -d ".next/static" ]; then
            echo "::error::Build output missing '.next/static' directory."
            exit 1
          fi
          echo "✅ Build output verified."
