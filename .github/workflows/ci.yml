name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ${{ secrets.TEST_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      DISABLE_RATE_LIMIT: "true"
      SKIP_VERTEX_MODEL_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Prettier check
        run: npx prettier --check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    env:
      NODE_ENV: test
      NEXTAUTH_SECRET: ${{ secrets.TEST_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_USER_EMAIL: ${{ secrets.TEST_AUTH_USER_EMAIL }}
      AUTH_USER_PASSWORD_HASH: ${{ secrets.TEST_AUTH_PASSWORD_HASH }}
      GOOGLE_PROJECT_ID: "dummy-project-id"
      GOOGLE_LOCATION: "us-central1"
      GOOGLE_VERTEX_AI_MODEL_ID: "gemini-2.5-flash-image"
      GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      NEXT_PUBLIC_TEST_EMAIL: ${{ secrets.TEST_AUTH_USER_EMAIL }}
      NEXT_PUBLIC_TEST_PASSWORD: "test123"
      ENABLE_TEST_CREDENTIALS: "true"
      NEXT_PUBLIC_ENABLE_TEST_CREDENTIALS: "true"
      DISABLE_RATE_LIMIT: "true"
      SKIP_VERTEX_MODEL_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --project=unit

      - name: Generate coverage report
        run: npx vitest run --coverage --project=unit

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.repository == 'roofsonfire/chat'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          flags: unit-tests
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx next build
        env:
          # Provide test secrets for build
          NEXTAUTH_SECRET: ${{ secrets.TEST_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          AUTH_USER_EMAIL: ${{ secrets.TEST_AUTH_USER_EMAIL }}
          AUTH_USER_PASSWORD_HASH: ${{ secrets.TEST_AUTH_PASSWORD_HASH }}
          ALLOWED_EMAILS: ${{ secrets.TEST_AUTH_USER_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.TEST_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
          GOOGLE_PROJECT_ID: dummy-project-id
          GOOGLE_LOCATION: us-central1
          GOOGLE_VERTEX_AI_MODEL_ID: gemini-2.5-flash-image
          DISABLE_RATE_LIMIT: "true"
          SKIP_VERTEX_MODEL_VALIDATION: "true"

      - name: Check build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed: .next directory not found"
            exit 1
          fi
          echo "Build successful!"
