name: Deploy to Cloud Run (Production)

on:
  # Deploy when CI workflow completes successfully
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  PROJECT_ID: norse-breaker-474323-n8
  REGION: us-central1
  SERVICE_NAME: chat-production
  DOMAIN: chat.daza.ar

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded on pushes to main or when triggered manually
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Check deployment trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "🎯 Deployment triggered by successful CI workflow"
            echo "CI Run: ${{ github.event.workflow_run.html_url }}"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "🎯 Deployment triggered manually"
            echo "Commit: ${{ github.sha }}"
          fi

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Validate Workload Identity configuration
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then
            echo "::error::Missing Workload Identity Federation configuration. Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT_EMAIL secrets."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # yamllint disable-line rule:line-length
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }} # Secrets configured in repository settings
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} # Secrets configured in repository settings
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Ensure Cloud Run SA can read required secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolving project number for $PROJECT_ID"
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          echo "Granting roles/secretmanager.secretAccessor to ${SA}"
          SECRETS=(
            nextauth-secret
            auth-email
            auth-password-hash
            google-project-id
            google-location
            google-vertex-ai-model-id
            google-client-id
            google-client-secret
            allowed-emails
          )
          for SECRET in "${SECRETS[@]}"; do
            echo "Binding $SECRET"
            gcloud secrets add-iam-policy-binding "$SECRET" \
              --member="serviceAccount:${SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --project="$PROJECT_ID" || true
          done

      - name: Build and push Docker image
        id: docker-build
        env:
          ALLOWED_EMAILS: ${{ secrets.TEST_AUTH_USER_EMAIL }}
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"

          docker build \
            --build-arg NODE_ENV=production \
            --build-arg ALLOWED_EMAILS="$ALLOWED_EMAILS" \
            --tag "${IMAGE_TAG}" \
            --tag "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest" \
            .
          docker push "${IMAGE_TAG}"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:latest"

          echo "image_url=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.docker-build.outputs.image_url }}
          flags: >-
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --timeout=300
            --max-instances=10
            --min-instances=0
            --concurrency=80
            --port=3000
            --set-env-vars="ENABLE_TEST_CREDENTIALS=false,NEXTAUTH_URL=https://${{ env.DOMAIN }}"
            --set-secrets="NEXTAUTH_SECRET=nextauth-secret:latest,AUTH_USER_EMAIL=auth-email:latest,AUTH_USER_PASSWORD_HASH=auth-password-hash:latest,GOOGLE_PROJECT_ID=google-project-id:latest,GOOGLE_LOCATION=google-location:latest,GOOGLE_VERTEX_AI_MODEL_ID=google-vertex-ai-model-id:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,ALLOWED_EMAILS=allowed-emails:latest"

      - name: Map domain
        continue-on-error: true # El mapping puede ya existir
        run: |
          gcloud run domain-mappings describe \
            --domain=${{ env.DOMAIN }} \
            --region=${{ env.REGION }} \
            --quiet || \
          gcloud run domain-mappings create \
            --service=${{ env.SERVICE_NAME }} \
            --domain=${{ env.DOMAIN }} \
            --region=${{ env.REGION }}

      - name: Show deployment URL
        run: |
          echo "🚀 Deployment successful!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "Custom Domain: https://${{ env.DOMAIN }}"
          echo "Commit: ${{ github.sha }}"

      - name: Verify deployment
        run: |
          # Esperar un poco para que el servicio esté listo
          sleep 10

          # Verificar que el servicio responde
          CLOUD_RUN_URL="${{ steps.deploy.outputs.url }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CLOUD_RUN_URL}")

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ] || [ "$HTTP_STATUS" -eq 307 ] || [ "$HTTP_STATUS" -eq 401 ]; then
            echo "✅ Service is responding (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Service returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Deployment Preview
              
              **Status:** ✅ Deployed successfully
              **Service URL:** ${{ steps.deploy.outputs.url }}
              **Custom Domain:** https://${{ env.DOMAIN }}
              **Commit:** \`${{ github.sha }}\`
              
              Test the deployment and verify all features work correctly.`
            })

  # Job para rollback en caso de emergencia
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    needs: [deploy]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Rollback to previous revision
        run: |
          echo "⚠️ Deployment failed, attempting rollback..."

          # Obtener la penúltima revisión
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service="${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --format='value(name)' \
            --limit=2 | tail -n 1)

          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Rolling back to revision: $PREVIOUS_REVISION"
            gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
              --region="${{ env.REGION }}" \
              --to-revisions="$PREVIOUS_REVISION=100"
            echo "✅ Rollback complete"
          else
            echo "⚠️ No previous revision found for rollback"
          fi
